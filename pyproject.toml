[build-system]
requires = ["setuptools>=75.6", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stanchion"
version = "1.0.0"
description = "Container log aggregation for unattended fuel forecourt site controllers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev", email = "anitalune373@gmail.com" }]
keywords = ["forecourt", "container-logs", "cri", "log-shipping", "redaction"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
# Upper bounds are tight rather than major version wide on purpose. click 8.2
# changed how a required option is enforced when a group is invoked with
# standalone_mode off, and a range that admits that is a range that admits a
# silent behaviour change on a box nobody logs into.
dependencies = [
    "click>=8.1.7,<8.2",
    "PyYAML>=6.0.1,<6.1",
]

[project.scripts]
stanchion = "stanchion.cli.main:run"

[project.urls]
Source = "https://github.com/rkaushik-dev/trammelworks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stanchion = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["stanchion"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers"
